name: osemosys

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osemosys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osemosys}
      POSTGRES_DB: ${POSTGRES_DB:-osemosys}
    ports:
      # Host/puerto explícitos para exponer Postgres a LAN/VPN.
      # Usa POSTGRES_BIND_HOST=127.0.0.1 para dejarlo solo local.
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ./backend
      args:
        HIGHS_BUILD_FROM_SOURCE: ${HIGHS_BUILD_FROM_SOURCE:-0}
        HIGHS_GIT_REF: ${HIGHS_GIT_REF:-master}
        HIGHS_ENABLE_HIPO: ${HIGHS_ENABLE_HIPO:-0}
    restart: unless-stopped
    command: >
      sh -lc "exec python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${API_WORKERS:-3}"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://osemosys:osemosys@db:5432/osemosys}
      DB_SCHEMA_OSEMOSYS: ${DB_SCHEMA_OSEMOSYS:-osemosys}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      APP_GIT_BRANCH: ${APP_GIT_BRANCH:-}
      APP_DEPLOY_ENV: ${APP_DEPLOY_ENV:-}
      SIMULATION_OPS_ENVIRONMENT_NAME: ${SIMULATION_OPS_ENVIRONMENT_NAME:-}
      SIMULATION_OPS_REMOTE_ENVIRONMENTS: ${SIMULATION_OPS_REMOTE_ENVIRONMENTS:-}
      SIMULATION_OPS_SHARED_TOKEN: ${SIMULATION_OPS_SHARED_TOKEN:-}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      DOCKER_METRICS_SERVICES: ${DOCKER_METRICS_SERVICES:-api,simulation-worker,db,redis,frontend}
      SIM_MAX_CONCURRENCY: ${SIM_MAX_CONCURRENCY:-1}
      SIM_USER_ACTIVE_LIMIT: ${SIM_USER_ACTIVE_LIMIT:-4}
      SIM_TOTAL_WEIGHT_LIMIT: ${SIM_TOTAL_WEIGHT_LIMIT:-8}
      SIM_WEIGHT_NATIONAL: ${SIM_WEIGHT_NATIONAL:-1}
      SIM_WEIGHT_REGIONAL: ${SIM_WEIGHT_REGIONAL:-3}
      SIM_SOLVER_THREADS: ${SIM_SOLVER_THREADS:-0}
      SIM_SOLVER_PROFILE: ${SIM_SOLVER_PROFILE:-default}
      SIM_SOLVER_HIGHS_METHOD: ${SIM_SOLVER_HIGHS_METHOD:-}
      SIM_SOLVER_HIGHS_PRESOLVE: ${SIM_SOLVER_HIGHS_PRESOLVE:-}
      SIM_SOLVER_HIGHS_PARALLEL: ${SIM_SOLVER_HIGHS_PARALLEL:-}
      SIM_SOLVER_HIGHS_HIPO_PARALLEL_TYPE: ${SIM_SOLVER_HIGHS_HIPO_PARALLEL_TYPE:-}
      SIM_SOLVER_HIGHS_CROSSOVER: ${SIM_SOLVER_HIGHS_CROSSOVER:-}
      SIM_SOLVER_HIGHS_OPTIONS_JSON: ${SIM_SOLVER_HIGHS_OPTIONS_JSON:-}
      SIM_SOLVER_HIGHS_TIME_LIMIT: ${SIM_SOLVER_HIGHS_TIME_LIMIT:-0}
      SIM_SOLVER_HIGHS_IPM_TOL: ${SIM_SOLVER_HIGHS_IPM_TOL:-1e-7}
      SIM_SOLVER_HIGHS_PRIMAL_TOL: ${SIM_SOLVER_HIGHS_PRIMAL_TOL:-1e-7}
      SIM_SOLVER_HIGHS_DUAL_TOL: ${SIM_SOLVER_HIGHS_DUAL_TOL:-1e-7}
      SIM_SOLVER_GLPK_PROFILE: ${SIM_SOLVER_GLPK_PROFILE:-fast}
      SIM_SOLVER_GLPK_TIME_LIMIT: ${SIM_SOLVER_GLPK_TIME_LIMIT:-0}
      SIM_SOLVER_GLPK_OPTIONS_JSON: ${SIM_SOLVER_GLPK_OPTIONS_JSON:-}
      SIM_SOLVER_HIGHS_DIRECT: ${SIM_SOLVER_HIGHS_DIRECT:-true}
      OSEMOSYS_FAST_DATAPORTAL: ${OSEMOSYS_FAST_DATAPORTAL:-1}
      OSEMOSYS_ACTIVITY_LOWER_PRUNE_TOL: ${OSEMOSYS_ACTIVITY_LOWER_PRUNE_TOL:-0}
      OSEMOSYS_SPARSE_MATRIX_PREPROCESS: ${OSEMOSYS_SPARSE_MATRIX_PREPROCESS:-1}
      OSEMOSYS_SPARSE_HIGH_DIM_PARAMS: ${OSEMOSYS_SPARSE_HIGH_DIM_PARAMS:-1}
      OSEMOSYS_SPARSE_EMISSION_PENALTIES: ${OSEMOSYS_SPARSE_EMISSION_PENALTIES:-1}
      OSEMOSYS_PYOMO_REPORT_TIMING: ${OSEMOSYS_PYOMO_REPORT_TIMING:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8010}:8000"
    volumes:
      - simulation_artifacts:/app/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *default-logging

  simulation-worker:
    build:
      context: ./backend
      args:
        HIGHS_BUILD_FROM_SOURCE: ${HIGHS_BUILD_FROM_SOURCE:-0}
        HIGHS_GIT_REF: ${HIGHS_GIT_REF:-master}
        HIGHS_ENABLE_HIPO: ${HIGHS_ENABLE_HIPO:-0}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://osemosys:osemosys@db:5432/osemosys}
      DB_SCHEMA_OSEMOSYS: ${DB_SCHEMA_OSEMOSYS:-osemosys}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      APP_GIT_BRANCH: ${APP_GIT_BRANCH:-}
      APP_DEPLOY_ENV: ${APP_DEPLOY_ENV:-}
      SIMULATION_OPS_ENVIRONMENT_NAME: ${SIMULATION_OPS_ENVIRONMENT_NAME:-}
      SIMULATION_OPS_REMOTE_ENVIRONMENTS: ${SIMULATION_OPS_REMOTE_ENVIRONMENTS:-}
      SIMULATION_OPS_SHARED_TOKEN: ${SIMULATION_OPS_SHARED_TOKEN:-}
      SIM_MAX_CONCURRENCY: ${SIM_MAX_CONCURRENCY:-1}
      SIM_USER_ACTIVE_LIMIT: ${SIM_USER_ACTIVE_LIMIT:-4}
      SIM_TOTAL_WEIGHT_LIMIT: ${SIM_TOTAL_WEIGHT_LIMIT:-8}
      SIM_WEIGHT_NATIONAL: ${SIM_WEIGHT_NATIONAL:-1}
      SIM_WEIGHT_REGIONAL: ${SIM_WEIGHT_REGIONAL:-3}
      SIM_SOLVER_THREADS: ${SIM_SOLVER_THREADS:-0}
      SIM_SOLVER_PROFILE: ${SIM_SOLVER_PROFILE:-default}
      SIM_SOLVER_HIGHS_METHOD: ${SIM_SOLVER_HIGHS_METHOD:-}
      SIM_SOLVER_HIGHS_PRESOLVE: ${SIM_SOLVER_HIGHS_PRESOLVE:-}
      SIM_SOLVER_HIGHS_PARALLEL: ${SIM_SOLVER_HIGHS_PARALLEL:-}
      SIM_SOLVER_HIGHS_HIPO_PARALLEL_TYPE: ${SIM_SOLVER_HIGHS_HIPO_PARALLEL_TYPE:-}
      SIM_SOLVER_HIGHS_CROSSOVER: ${SIM_SOLVER_HIGHS_CROSSOVER:-}
      SIM_SOLVER_HIGHS_OPTIONS_JSON: ${SIM_SOLVER_HIGHS_OPTIONS_JSON:-}
      SIM_SOLVER_HIGHS_TIME_LIMIT: ${SIM_SOLVER_HIGHS_TIME_LIMIT:-0}
      SIM_SOLVER_HIGHS_IPM_TOL: ${SIM_SOLVER_HIGHS_IPM_TOL:-1e-7}
      SIM_SOLVER_HIGHS_PRIMAL_TOL: ${SIM_SOLVER_HIGHS_PRIMAL_TOL:-1e-7}
      SIM_SOLVER_HIGHS_DUAL_TOL: ${SIM_SOLVER_HIGHS_DUAL_TOL:-1e-7}
      SIM_SOLVER_GLPK_PROFILE: ${SIM_SOLVER_GLPK_PROFILE:-fast}
      SIM_SOLVER_GLPK_TIME_LIMIT: ${SIM_SOLVER_GLPK_TIME_LIMIT:-0}
      SIM_SOLVER_GLPK_OPTIONS_JSON: ${SIM_SOLVER_GLPK_OPTIONS_JSON:-}
      SIM_SOLVER_HIGHS_DIRECT: ${SIM_SOLVER_HIGHS_DIRECT:-true}
      OSEMOSYS_FAST_DATAPORTAL: ${OSEMOSYS_FAST_DATAPORTAL:-1}
      OSEMOSYS_ACTIVITY_LOWER_PRUNE_TOL: ${OSEMOSYS_ACTIVITY_LOWER_PRUNE_TOL:-0}
      OSEMOSYS_SPARSE_MATRIX_PREPROCESS: ${OSEMOSYS_SPARSE_MATRIX_PREPROCESS:-1}
      OSEMOSYS_SPARSE_HIGH_DIM_PARAMS: ${OSEMOSYS_SPARSE_HIGH_DIM_PARAMS:-1}
      OSEMOSYS_SPARSE_EMISSION_PENALTIES: ${OSEMOSYS_SPARSE_EMISSION_PENALTIES:-1}
      OSEMOSYS_PYOMO_REPORT_TIMING: ${OSEMOSYS_PYOMO_REPORT_TIMING:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
    command: >
      celery -A app.simulation.celery_app:celery_app worker
      --loglevel=INFO
      --concurrency=${SIM_MAX_CONCURRENCY:-1}
      --hostname=simulation-worker@%h
      --pool=prefork
      --prefetch-multiplier=1
      --max-tasks-per-child=${SIM_WORKER_MAX_TASKS_PER_CHILD:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - simulation_artifacts:/app/tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.simulation.celery_app:celery_app inspect ping -d simulation-worker@$$HOSTNAME >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_SIMULATION_MODE: ${VITE_SIMULATION_MODE:-api}
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${FRONTEND_API_UPSTREAM:-api:8000}
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    networks:
      - default
      - backend_bridge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  simulation_artifacts:

networks:
  backend_bridge:
    external: true
    name: ${BACKEND_BRIDGE_NETWORK:-osemosys_api_bridge}
